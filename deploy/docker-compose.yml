services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: auth
      MYSQL_USER: auth
      MYSQL_PASSWORD: ${DATABASE_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--default-time-zone=+08:00"]
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    image: ghcr.io/seanldnet/auth-backend:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "false"
      APP_TRACE: "false"
      DATABASE_TYPE: mysql
      DATABASE_HOSTNAME: db
      DATABASE_PORT: "3306"
      DATABASE_DATABASE: auth
      DATABASE_USERNAME: auth
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_CHARSET: utf8mb4
      DATABASE_PREFIX: auth_
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_SELECT: "0"
      AUTH_BOOTSTRAP_ADMIN_USERNAME: admin
      AUTH_BOOTSTRAP_ADMIN_PASSWORD: "123456"
      TZ: Asia/Shanghai
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/api/health') === false ? 1 : 0);"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
  frontend:
    image: ghcr.io/seanldnet/auth-frontend:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${AUTH_HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  mysql_data:
  redis_data:
