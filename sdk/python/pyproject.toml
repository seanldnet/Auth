[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auth-license-sdk"
version = "0.1.0"
description = "RSA-PSS authenticated Python client for the Auth license API"
requires-python = ">=3.10"
dependencies = [
  "cryptography>=42.0.0",
  "requests>=2.31.0"
]

[project.optional-dependencies]
test = ["pytest>=8.0.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["auth_license_sdk*"]
