[package]
name = "auth-license-sdk"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "RSA-PSS authenticated Rust client for the Auth license API"
license = "MIT"

[dependencies]
base64 = "0.22"
hex = "0.4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rsa = { version = "0.9", features = ["pem", "sha2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
url = "2"

[dev-dependencies]
