name: Quality Gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect backend project
        id: detect
        run: echo "present=$([ -f backend/composer.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: shivammathur/setup-php@v2
        if: steps.detect.outputs.present == 'true'
        with:
          php-version: '8.2'
          extensions: curl, pdo_mysql, redis, mbstring
          coverage: none
      - name: Install backend dependencies
        if: steps.detect.outputs.present == 'true'
        run: composer install --no-interaction --prefer-dist
        working-directory: backend
      - name: Validate Composer manifest
        if: steps.detect.outputs.present == 'true'
        run: composer validate --strict
        working-directory: backend
      - name: PHP syntax check
        if: steps.detect.outputs.present == 'true'
        run: composer check:syntax
        working-directory: backend
      - name: Run unit tests
        if: steps.detect.outputs.present == 'true'
        run: composer test
        working-directory: backend
      - name: Dependency security audit
        if: steps.detect.outputs.present == 'true'
        run: composer audit --no-interaction
        working-directory: backend
      - name: Explain skipped backend checks
        if: steps.detect.outputs.present != 'true'
        run: echo "Backend project not present in this change; checks will run when backend/ is introduced."

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect frontend project
        id: detect
        run: echo "present=$([ -f frontend/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: '22'
      - name: Install frontend dependencies
        if: steps.detect.outputs.present == 'true'
        run: npm install
        working-directory: frontend
      - name: Type check
        if: steps.detect.outputs.present == 'true'
        run: npm run typecheck
        working-directory: frontend
      - name: Production build
        if: steps.detect.outputs.present == 'true'
        run: npm run build
        working-directory: frontend
      - name: Dependency security audit
        if: steps.detect.outputs.present == 'true'
        run: npm audit --audit-level=high
        working-directory: frontend
      - name: Explain skipped frontend checks
        if: steps.detect.outputs.present != 'true'
        run: echo "Frontend project not present in this change; checks will run when frontend/ is introduced."

  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect .NET SDK project
        id: detect
        run: echo "present=$([ -f sdk/csharp/Auth.LicenseSdk.Tests/Auth.LicenseSdk.Tests.csproj ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-dotnet@v4
        if: steps.detect.outputs.present == 'true'
        with:
          dotnet-version: '8.0.x'
      - name: Run .NET SDK tests
        if: steps.detect.outputs.present == 'true'
        run: dotnet test sdk/csharp/Auth.LicenseSdk.Tests/Auth.LicenseSdk.Tests.csproj --configuration Release
      - name: Explain skipped .NET checks
        if: steps.detect.outputs.present != 'true'
        run: echo ".NET SDK project not present in this change; checks will run when sdk/csharp/ is introduced."

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python SDK and test dependencies
        run: python -m pip install -e ".[test]"
        working-directory: sdk/python
      - name: Run Python SDK tests
        run: python -m pytest tests
        working-directory: sdk/python
