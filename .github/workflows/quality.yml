name: Quality Gates

concurrency:
  group: auth-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect backend project
        id: detect
        run: echo "present=$([ -f backend/composer.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: shivammathur/setup-php@v2
        if: steps.detect.outputs.present == 'true'
        with:
          php-version: '8.2'
          extensions: curl, pdo_mysql, redis, mbstring
          coverage: none
      - name: Install backend dependencies
        if: steps.detect.outputs.present == 'true'
        run: composer install --no-interaction --prefer-dist
        working-directory: backend
      - name: Validate Composer manifest
        if: steps.detect.outputs.present == 'true'
        run: composer validate --strict
        working-directory: backend
      - name: PHP syntax check
        if: steps.detect.outputs.present == 'true'
        run: composer check:syntax
        working-directory: backend
      - name: Run unit tests
        if: steps.detect.outputs.present == 'true'
        run: composer test
        working-directory: backend
      - name: Dependency security audit
        if: steps.detect.outputs.present == 'true'
        run: composer audit --no-interaction
        working-directory: backend
      - name: Explain skipped backend checks
        if: steps.detect.outputs.present != 'true'
        run: echo "Backend project not present in this change; checks will run when backend/ is introduced."

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect frontend project
        id: detect
        run: echo "present=$([ -f frontend/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: '22'
      - name: Install frontend dependencies
        if: steps.detect.outputs.present == 'true'
        run: npm install
        working-directory: frontend
      - name: Type check
        if: steps.detect.outputs.present == 'true'
        run: npm run typecheck
        working-directory: frontend
      - name: Production build
        if: steps.detect.outputs.present == 'true'
        run: npm run build
        working-directory: frontend
      - name: Dependency security audit
        if: steps.detect.outputs.present == 'true'
        run: npm audit --audit-level=high
        working-directory: frontend
      - name: Explain skipped frontend checks
        if: steps.detect.outputs.present != 'true'
        run: echo "Frontend project not present in this change; checks will run when frontend/ is introduced."

  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect .NET SDK project
        id: detect
        run: echo "present=$([ -f sdk/csharp/Auth.LicenseSdk.Tests/Auth.LicenseSdk.Tests.csproj ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-dotnet@v4
        if: steps.detect.outputs.present == 'true'
        with:
          dotnet-version: '8.0.x'
      - name: Run .NET SDK tests
        if: steps.detect.outputs.present == 'true'
        run: dotnet test sdk/csharp/Auth.LicenseSdk.Tests/Auth.LicenseSdk.Tests.csproj --configuration Release
      - name: Explain skipped .NET checks
        if: steps.detect.outputs.present != 'true'
        run: echo ".NET SDK project not present in this change; checks will run when sdk/csharp/ is introduced."

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python SDK and test dependencies
        run: python -m pip install -e ".[test]"
        working-directory: sdk/python
      - name: Run Python SDK tests
        run: python -m pytest tests
        working-directory: sdk/python

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Run Go SDK tests
        run: go test ./...
        working-directory: sdk/go

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      - name: Run Java SDK tests
        run: mvn -B test
        working-directory: sdk/java

  typescript-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install SDK dependencies
        run: npm install
        working-directory: sdk/typescript
      - name: Build and test TypeScript SDK
        run: npm test
        working-directory: sdk/typescript

  php-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json
          coverage: none
      - name: Install PHP SDK dependencies
        run: composer install --no-interaction --prefer-dist
        working-directory: sdk/php
      - name: Check PHP SDK syntax
        run: composer check:syntax
        working-directory: sdk/php
      - name: Run PHP SDK tests
        run: composer test
        working-directory: sdk/php

  cpp-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install C++ SDK dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libssl-dev libcurl4-openssl-dev nlohmann-json3-dev
      - name: Configure C++ SDK
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
        working-directory: sdk/cpp
      - name: Build C++ SDK
        run: cmake --build build --parallel 2
        working-directory: sdk/cpp
      - name: Run C++ SDK tests
        run: ctest --test-dir build --output-on-failure
        working-directory: sdk/cpp

  c-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install C SDK dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libssl-dev libcurl4-openssl-dev libjson-c-dev pkg-config
      - name: Configure C SDK
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
        working-directory: sdk/c
      - name: Build C SDK
        run: cmake --build build --parallel 2
        working-directory: sdk/c
      - name: Run C SDK tests
        run: ctest --test-dir build --output-on-failure
        working-directory: sdk/c

  rust-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdk/rust
      - name: Run Rust SDK tests
        run: cargo test --all
        working-directory: sdk/rust
      - name: Build Rust SDK release
        run: cargo build --release
        working-directory: sdk/rust

  kotlin-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install Gradle 8.12
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.12-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
      - name: Run Kotlin SDK tests
        run: /tmp/gradle-8.12/bin/gradle --no-daemon test
        working-directory: sdk/kotlin

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment shell scripts
        run: bash -n deploy/install.sh && sh -n deploy/backend-entrypoint.sh && sh -n deploy/scheduler-entrypoint.sh
      - name: Validate Docker Compose configuration
        run: |
          cat > .env <<'EOF'
          APP_KEY=01234567890123456789012345678901
          AUTH_DB_PASSWORD=01234567890123456789012345678901
          MYSQL_ROOT_PASSWORD=01234567890123456789012345678901
          AUTH_BOOTSTRAP_ADMIN_PASSWORD=123456
          EOF
          docker compose --env-file .env -f deploy/docker-compose.yml config -q
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          tags: ghcr.io/seanldnet/auth-backend:latest
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          load: true
          tags: ghcr.io/seanldnet/auth-frontend:latest
      - name: Boot full Docker stack
        run: docker compose --env-file .env -f deploy/docker-compose.yml up -d
      - name: Inspect initialized Docker services
        run: |
          docker compose --env-file .env -f deploy/docker-compose.yml ps
          docker compose --env-file .env -f deploy/docker-compose.yml logs --tail=80 backend scheduler frontend
      - name: Smoke test frontend, migrations, and default administrator
        run: |
          ready=false
          for attempt in $(seq 1 60); do
            if curl --max-time 5 -fsS http://127.0.0.1/api/health >/dev/null 2>&1; then ready=true; break; fi
            sleep 5
          done
          if [ "$ready" != "true" ]; then
            docker compose --env-file .env -f deploy/docker-compose.yml ps
            docker compose --env-file .env -f deploy/docker-compose.yml logs --tail=150 backend scheduler frontend db
            exit 1
          fi
          curl --max-time 15 -fsS http://127.0.0.1/ | grep -qi '<div id="root">'
          login=$(curl -fsS -H 'Content-Type: application/json' -H 'Accept: application/json' -d '{"username":"admin","password":"123456"}' -c /tmp/auth-cookies.txt http://127.0.0.1/api/auth/login)
          echo "$login" | grep -q '"success":true'
          echo "$login" | grep -q '"must_change_password":true'
          test -s /tmp/auth-cookies.txt
          me=$(curl -fsS -b /tmp/auth-cookies.txt http://127.0.0.1/api/auth/me)
          echo "$me" | grep -q '"must_change_password":true'
          changed=$(curl -fsS -X POST -H 'Content-Type: application/json' -b /tmp/auth-cookies.txt -d '{"current_password":"123456","new_password":"Docker-Smoke-Test-2026!"}' http://127.0.0.1/api/auth/change-password)
          echo "$changed" | grep -q '"success":true'
          relogin=$(curl -fsS -H 'Content-Type: application/json' -d '{"username":"admin","password":"Docker-Smoke-Test-2026!"}' http://127.0.0.1/api/auth/login)
          echo "$relogin" | grep -q '"success":true'
          echo "$relogin" | grep -q '"must_change_password":false'
          set -a
          . ./.env
          set +a
          migrations=$(docker compose --env-file .env -f deploy/docker-compose.yml exec -T db mysql -uauth -p"$AUTH_DB_PASSWORD" auth -Nse "SELECT COUNT(*) FROM auth_schema_migrations")
          test "$migrations" = "15"
          wallets=$(docker compose --env-file .env -f deploy/docker-compose.yml exec -T db mysql -uauth -p"$AUTH_DB_PASSWORD" auth -Nse "SELECT COUNT(*) FROM auth_wallet_accounts")
          test "$wallets" = "1"
      - name: Show Docker logs on smoke-test failure
        if: failure()
        run: docker compose --env-file .env -f deploy/docker-compose.yml logs --tail=150
      - name: Stop Docker stack
        if: always()
        run: docker compose --env-file .env -f deploy/docker-compose.yml down -v
