name: Quality Gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect backend project
        id: detect
        run: echo "present=$([ -f backend/composer.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: shivammathur/setup-php@v2
        if: steps.detect.outputs.present == 'true'
        with:
          php-version: '8.2'
          extensions: curl, pdo_mysql, redis, mbstring
          coverage: none
      - name: Install backend dependencies
        if: steps.detect.outputs.present == 'true'
        run: composer install --no-interaction --prefer-dist
        working-directory: backend
      - name: Validate Composer manifest
        if: steps.detect.outputs.present == 'true'
        run: composer validate --strict
        working-directory: backend
      - name: PHP syntax check
        if: steps.detect.outputs.present == 'true'
        run: composer check:syntax
        working-directory: backend
      - name: Run unit tests
        if: steps.detect.outputs.present == 'true'
        run: composer test
        working-directory: backend
      - name: Dependency security audit
        if: steps.detect.outputs.present == 'true'
        run: composer audit --no-interaction
        working-directory: backend
      - name: Explain skipped backend checks
        if: steps.detect.outputs.present != 'true'
        run: echo "Backend project not present in this change; checks will run when backend/ is introduced."

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect frontend project
        id: detect
        run: echo "present=$([ -f frontend/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: '22'
      - name: Install frontend dependencies
        if: steps.detect.outputs.present == 'true'
        run: npm install
        working-directory: frontend
      - name: Type check
        if: steps.detect.outputs.present == 'true'
        run: npm run typecheck
        working-directory: frontend
      - name: Production build
        if: steps.detect.outputs.present == 'true'
        run: npm run build
        working-directory: frontend
      - name: Dependency security audit
        if: steps.detect.outputs.present == 'true'
        run: npm audit --audit-level=high
        working-directory: frontend
      - name: Explain skipped frontend checks
        if: steps.detect.outputs.present != 'true'
        run: echo "Frontend project not present in this change; checks will run when frontend/ is introduced."

  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect .NET SDK project
        id: detect
        run: echo "present=$([ -f sdk/csharp/Auth.LicenseSdk.Tests/Auth.LicenseSdk.Tests.csproj ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-dotnet@v4
        if: steps.detect.outputs.present == 'true'
        with:
          dotnet-version: '8.0.x'
      - name: Run .NET SDK tests
        if: steps.detect.outputs.present == 'true'
        run: dotnet test sdk/csharp/Auth.LicenseSdk.Tests/Auth.LicenseSdk.Tests.csproj --configuration Release
      - name: Explain skipped .NET checks
        if: steps.detect.outputs.present != 'true'
        run: echo ".NET SDK project not present in this change; checks will run when sdk/csharp/ is introduced."

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python SDK and test dependencies
        run: python -m pip install -e ".[test]"
        working-directory: sdk/python
      - name: Run Python SDK tests
        run: python -m pytest tests
        working-directory: sdk/python

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Run Go SDK tests
        run: go test ./...
        working-directory: sdk/go

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      - name: Run Java SDK tests
        run: mvn -B test
        working-directory: sdk/java

  typescript-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install SDK dependencies
        run: npm install
        working-directory: sdk/typescript
      - name: Build and test TypeScript SDK
        run: npm test
        working-directory: sdk/typescript

  php-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json
          coverage: none
      - name: Install PHP SDK dependencies
        run: composer install --no-interaction --prefer-dist
        working-directory: sdk/php
      - name: Check PHP SDK syntax
        run: composer check:syntax
        working-directory: sdk/php
      - name: Run PHP SDK tests
        run: composer test
        working-directory: sdk/php

  cpp-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install C++ SDK dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libssl-dev libcurl4-openssl-dev nlohmann-json3-dev
      - name: Configure C++ SDK
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
        working-directory: sdk/cpp
      - name: Build C++ SDK
        run: cmake --build build --parallel 2
        working-directory: sdk/cpp
      - name: Run C++ SDK tests
        run: ctest --test-dir build --output-on-failure
        working-directory: sdk/cpp

  c-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install C SDK dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libssl-dev libcurl4-openssl-dev libjson-c-dev pkg-config
      - name: Configure C SDK
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
        working-directory: sdk/c
      - name: Build C SDK
        run: cmake --build build --parallel 2
        working-directory: sdk/c
      - name: Run C SDK tests
        run: ctest --test-dir build --output-on-failure
        working-directory: sdk/c

  rust-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdk/rust
      - name: Run Rust SDK tests
        run: cargo test --all
        working-directory: sdk/rust
      - name: Build Rust SDK release
        run: cargo build --release
        working-directory: sdk/rust

  kotlin-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install Gradle 8.12
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.12-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
      - name: Run Kotlin SDK tests
        run: /tmp/gradle-8.12/bin/gradle --no-daemon test
        working-directory: sdk/kotlin

  docker-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: ghcr.io/seanldnet/auth-backend:ci
          load: true
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: ghcr.io/seanldnet/auth-frontend:ci
          load: true

      - name: Start full Docker stack and initialize MySQL
        run: |
          mkdir -p /tmp/auth-docker-smoke
          cat > .env <<EOF
          APP_KEY=$(openssl rand -hex 32)
          DATABASE_PASSWORD=$(openssl rand -hex 24)
          MYSQL_ROOT_PASSWORD=$(openssl rand -hex 24)
          REDIS_PASSWORD=$(openssl rand -hex 24)
          AUTH_HTTP_PORT=18080
          EOF
          docker compose --env-file .env -f deploy/docker-compose.yml -f deploy/docker-compose.ci.yml up -d
      - name: Wait for API and verify default administrator login
        run: |
          ready=0
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:18080/api/health >/dev/null 2>&1; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            docker compose --env-file .env -f deploy/docker-compose.yml -f deploy/docker-compose.ci.yml ps
            docker compose --env-file .env -f deploy/docker-compose.yml -f deploy/docker-compose.ci.yml logs --tail=150 backend db
            exit 1
          fi
          response=$(curl -sS -H 'Content-Type: application/json' -d '{"username":"admin","password":"123456"}' http://127.0.0.1:18080/api/auth/login || true)
          echo "$response" | head -c 8000
          echo
          echo "$response" | jq -e '.success == true and .data.user.role == "ADMIN"'
      - name: Stop Docker smoke stack
        if: always()
        run: docker compose --env-file .env -f deploy/docker-compose.yml -f deploy/docker-compose.ci.yml down -v
