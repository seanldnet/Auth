name: Publish Docker Images
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "deploy/**"
      - ".github/workflows/docker-publish.yml"
      - ".dockerignore"
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/seanldnet/auth-backend:latest
            ghcr.io/seanldnet/auth-backend:${{ github.sha }}
          cache-from: type=gha,scope=auth-backend
          cache-to: type=gha,mode=max,scope=auth-backend
      - name: Build and publish frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/seanldnet/auth-frontend:latest
            ghcr.io/seanldnet/auth-frontend:${{ github.sha }}
          cache-from: type=gha,scope=auth-frontend
          cache-to: type=gha,mode=max,scope=auth-frontend
